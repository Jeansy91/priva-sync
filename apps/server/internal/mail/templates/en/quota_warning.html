{{define "body"}}
<h1 style="margin:0 0 16px;font-size:20px;">Storage at {{.Percentage}}%</h1>
<p style="margin:0 0 16px;">Hi {{.Username}},</p>
<p style="margin:0 0 16px;">your PrivaSync storage is <strong>{{.Percentage}}%</strong> full:</p>

<table role="presentation" cellspacing="0" cellpadding="0" border="0" style="background:#f9fafb;border-radius:6px;margin:16px 0;width:100%;">
  <tr><td style="padding:12px 16px;"><strong>Used:</strong> {{formatBytes .UsedBytes}}</td></tr>
  <tr><td style="padding:0 16px 12px;"><strong>Quota:</strong> {{formatBytes .QuotaBytes}}</td></tr>
</table>

<p style="margin:16px 0;">Free up space or contact your administrator for more storage.</p>

<p style="margin:24px 0;">
  <a href="{{.BaseURL}}/files" style="display:inline-block;background:#2563eb;color:#fff;text-decoration:none;padding:10px 20px;border-radius:6px;font-weight:600;">Manage files</a>
</p>
{{end}}
