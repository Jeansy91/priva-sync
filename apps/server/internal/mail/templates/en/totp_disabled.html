{{define "body"}}
<h1 style="margin:0 0 16px;font-size:20px;color:#b91c1c;">Two-factor authentication disabled</h1>
<p style="margin:0 0 16px;">Hi {{.Username}},</p>
<p style="margin:0 0 16px;">two-factor authentication was just disabled on your PrivaSync account:</p>

<table role="presentation" cellspacing="0" cellpadding="0" border="0" style="background:#fee2e2;border-radius:6px;margin:16px 0;width:100%;">
  <tr><td style="padding:12px 16px;"><strong>Time:</strong> {{.When}}</td></tr>
  <tr><td style="padding:0 16px 12px;"><strong>IP address:</strong> {{.IPAddress}}</td></tr>
</table>

<p style="margin:16px 0;"><strong>Wasn't you?</strong> Change your password immediately and re-enable 2FA.</p>

<p style="margin:24px 0;">
  <a href="{{.BaseURL}}/settings" style="display:inline-block;background:#2563eb;color:#fff;text-decoration:none;padding:10px 20px;border-radius:6px;font-weight:600;">Open settings</a>
</p>
{{end}}
