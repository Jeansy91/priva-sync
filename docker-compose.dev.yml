services:
  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB:       privasync
      POSTGRES_USER:     privasync
      POSTGRES_PASSWORD: devpassword
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test:     ["CMD-SHELL", "pg_isready -U privasync"]
      interval: 5s
      timeout:  3s
      retries:  5

volumes:
  pgdata_dev:
