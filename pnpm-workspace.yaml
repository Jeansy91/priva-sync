packages:
  - 'apps/web'
  - 'apps/desktop'
  - 'packages/*'
allowBuilds:
  core-js: true
  es5-ext: true
  esbuild: true
# Moved from package.json "pnpm.overrides" (pnpm >=11 no longer reads the
# "pnpm" field in package.json; silently ignored it otherwise, dropping
# these CVE fixes without warning). See minimumReleaseAgeExclude below for
# why these bypass the 7-day quarantine.
overrides:
  '@xmldom/xmldom@<0.8.15': ^0.9.0
  dompurify@<3.4.17: ^3.4.17
  nanoid@<3.3.17: ^3.3.17
  postcss@<8.5.18: ^8.5.18
# Supply-chain hardening (pnpm >=10). blockExoticSubdeps rejects transitive
# deps pulled from git/http/tarball sources; minimumReleaseAge quarantines
# freshly published versions for 7 days (resolution-time only — frozen-lockfile
# installs are unaffected); trustPolicy blocks updates that would downgrade
# security settings.
blockExoticSubdeps: true
minimumReleaseAge: 10080
trustPolicy: no-downgrade
# Security patches are exempt from the 7-day quarantine: these dev-tooling
# transitives are force-updated via the "overrides" key above to close
# published high-severity advisories (postcss/nanoid path-traversal + DoS,
# xmldom/dompurify). Waiting a week to apply a security fix is
# the wrong trade-off, so they bypass minimumReleaseAge by name.
minimumReleaseAgeExclude:
  - nanoid
  - postcss
  - '@xmldom/xmldom'
